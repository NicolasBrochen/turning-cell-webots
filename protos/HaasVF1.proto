    const PROBE = {"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.0125,-0.02,-0.008,"holder"],["cyl",0.02,-0.04,-0.02,"probe"],["cyl",0.0202,-0.052,-0.04,"window"],["cyl",0.02,-0.066,-0.052,"probe"],["cyl",0.008,-0.07,-0.066,"probe"],["cyl",0.0022,-0.117,-0.07,"stylus"],["sphere",0.003,-0.117,-0.117,"cutter"]],"colour":[0.8,0.06,0.1]};
    const toolSet = [...new Set(fields.tools.value.filter(n => n >= 1 && n <= 20))].sort((a, b) => a - b);
    const st = toolSet.includes(fields.spindleTool.value) ? fields.spindleTool.value : 0;
    const f4 = v => (v + 0).toFixed(4);
    function toolShapes(n) {
