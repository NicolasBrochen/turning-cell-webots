    const pl = clamp(fields.doorLeftPosition.value, 0, 0.4000);
    const pr = clamp(fields.doorRightPosition.value, 0, 0.4000);
    const pc = clamp(fields.carouselSlide.value, 0, 0.2295);
    const pq = fields.carouselAngle.value;
    const TOOLS = [{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.02,-0.058,-0.008,"holder"],["cyl",0.006,-0.118,-0.058,"cutter"]],"colour":[0.33,0.27,0.45]},{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.025,-0.05,-0.008,"holder"],["cyl",0.015,-0.06,-0.05,"holder"],["cyl",0.00425,-0.16,-0.06,"cutter"],["cone",0.00425,-0.165,-0.16,"cutter"]],"colour":[0.85,0.68,0.22]},{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.02,-0.04,-0.008,"holder"],["cyl",0.0315,-0.082,-0.04,"body"],["cyl",0.0318,-0.09,-0.082,"cutter"]],"colour":[0.85,0.68,0.22]},{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.022,-0.062,-0.008,"holder"],["cyl",0.01,-0.107,-0.062,"cutter"]],"colour":[0.12,0.12,0.14]},{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"holder"],["cyl",0.03175,-0.008,-0.003,"holder"],["cyl",0.018,-0.07,-0.008,"holder"],["cyl",0.005,-0.095,-0.07,"cutter"],["cone",0.005,-0.1,-0.095,"cutter"]],"colour":[0.75,0.76,0.78]},{"parts":[["cyl",0.0105,0.076,0.104,"holder"],["cyl",0.016,0.042,0.076,"holder"],["cyl",0.0205,0.008,0.042,"holder"],["cyl",0.03175,0.003,0.008,"holder"],["cyl",0.0275,-0.003,0.003,"h